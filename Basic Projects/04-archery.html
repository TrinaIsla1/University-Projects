<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archery</title><style>body{margin:0;background:#222;color:#fff;font-family:system-ui;text-align:center}canvas{background:#2e7d32;max-width:100%;touch-action:none;display:block;margin:auto}h2{margin:8px}button{padding:8px 14px;margin:6px;border:0;border-radius:6px;font-size:16px} canvas{background:#87ceeb}</style></head><body><h2>🏹 Archery</h2><div id="hud"></div><canvas id="c" width="480" height="400"></canvas><p>Move mouse/finger to aim, click/tap to shoot. 10 arrows.</p>
<script>
const x=c.getContext('2d');let ty=200,td=2.2,aim=200,arrow=null,score=0,left=10,last='';
function pos(e){const r=c.getBoundingClientRect();aim=(e.clientY-r.top)*c.height/r.height}
c.onpointermove=pos;c.onpointerdown=e=>{pos(e);if(left<=0){score=0;left=10;last='';return}if(!arrow)arrow={x:60,y:aim,vy:(Math.random()-.5)*1.4}}
const cols=['#fff','#222','#2980b9','#e74c3c','#f1c40f'];
function loop(){x.clearRect(0,0,480,400);x.fillStyle='#4caf50';x.fillRect(0,360,480,40);
ty+=td;if(ty<90||ty>310)td=-td;
for(let i=0;i<5;i++){x.fillStyle=cols[i];x.beginPath();x.arc(410,ty,70-i*14,0,7);x.fill()}
x.strokeStyle='#5d4037';x.lineWidth=4;x.beginPath();x.arc(40,aim,30,-1.2,1.2);x.stroke();
if(arrow){arrow.x+=12;arrow.y+=arrow.vy;x.fillStyle='#000';x.fillRect(arrow.x-30,arrow.y-1,34,3);
if(arrow.x>=410){const d=Math.abs(arrow.y-ty),pts=d<14?10:d<28?8:d<42?6:d<56?4:d<70?2:0;score+=pts;last='+'+pts;left--;arrow=null}}
hud.textContent='Score: '+score+'   Arrows: '+left+'   '+last+(left<=0?'  GAME OVER - tap to restart':'');requestAnimationFrame(loop)}
loop();
</script></body></html>
