<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sari-Sari Store</title><style>
body{font-family:system-ui;margin:0;background:#fff7e6}header{background:#e67e22;color:#fff;padding:12px 16px;font-size:20px}
main{display:flex;flex-wrap:wrap;gap:16px;padding:16px}.grid{flex:2;min-width:280px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;align-content:start}
.card{background:#fff;border-radius:10px;padding:10px;text-align:center;box-shadow:0 1px 4px #0002;font-size:14px}.card b{font-size:34px;display:block}
button{background:#e67e22;color:#fff;border:0;border-radius:6px;padding:6px 10px;cursor:pointer}
.cart{flex:1;min-width:260px;background:#fff;padding:12px;border-radius:10px;align-self:start}.row{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
input{width:100%;padding:6px;box-sizing:border-box}</style></head><body><header>🏪 Aling Nena's Sari-Sari Store</header>
<main><div class="grid" id="grid"></div><div class="cart"><h3>Cart</h3><div id="items"></div><hr><div class="row"><b>Total</b><b id="total">₱0</b></div>
<input id="pay" type="number" placeholder="Cash received"><p id="chg"></p><button onclick="checkout()">Checkout</button></div></main>
<script>
const P=[["Lucky Me Pancit Canton","🍜",15],["Coke Mismo","🥤",20],["Skyflakes","🍘",8],["Egg","🥚",10],["Kape 3-in-1","☕",7],["Rice (1 kilo)","🍚",55],["Sardinas","🥫",25],["Candy","🍬",1],["Sabon","🧼",18],["Load ₱50","📱",52]];
let cart={};
grid.innerHTML=P.map((p,i)=>'<div class="card"><b>'+p[1]+'</b>'+p[0]+'<br>₱'+p[2]+'<br><button onclick="add('+i+')">Add</button></div>').join('');
function add(i){cart[i]=(cart[i]||0)+1;draw()}
function chg(i,d){cart[i]+=d;if(cart[i]<=0)delete cart[i];draw()}
function tot(){return Object.keys(cart).reduce((s,i)=>s+P[i][2]*cart[i],0)}
function draw(){items.innerHTML=Object.keys(cart).map(i=>'<div class="row"><span>'+P[i][0]+'</span><span><button onclick="chg('+i+',-1)">-</button> '+cart[i]+' <button onclick="chg('+i+',1)">+</button></span></div>').join('')||'Empty cart';total.textContent='₱'+tot();chg_.textContent=''}
const chg_=document.getElementById('chg');
function checkout(){const t=tot(),p=+pay.value;if(!t)return alert('Cart is empty');if(p<t)return alert('Kulang ang bayad!');chg_.textContent='Salamat! Sukli: ₱'+(p-t);cart={};items.innerHTML='Empty cart';total.textContent='₱0';pay.value=''}
draw();
</script></body></html>
